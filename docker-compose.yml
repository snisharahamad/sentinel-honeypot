version: '3.8'

services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: sentinel-cowrie
    ports:
      - "22:2222"
    restart: always

  loki:
    image: grafana/loki:2.9.2
    container_name: sentinel-loki
    volumes:
      - ./loki/config/local-config.yaml:/etc/loki/local-config.yaml
      - ./loki/data:/loki/data
    command: -config.file=/etc/loki/local-config.yaml
    restart: always

  promtail:
    image: grafana/promtail:2.9.2
    container_name: sentinel-promtail
    volumes:
      - ./promtail/config/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    restart: always
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
    restart: always
    depends_on:
      - loki
